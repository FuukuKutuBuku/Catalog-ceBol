<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="assets/logo-ceBol.svg" alt="Cebol Logo">
        </div>

        <nav>
            <button>HOME</button>
            <button>ABOUT</button>
            <button>COLLECTION</button>
            <button>HOW TO ORDER</button>
        </nav>

        <div class="order">
            <button>ORDER NOW</button>
        </div>
    </header>

    <section class = "hero" id = "home">

        <div class = "hero-kanan">
            <p class="text-alis">BLIND BOX • ACRYLIC KEYCHAIN COLLECTION</p>

            <h1>DON'T PEEK
            <br>
            <span class = "text-besar">YOU DON'T GET TO CHOOSE LET THE BOX CHOOSE YOU</span>
            </h1>
            <p class="hero-desc">Discover the excitement of our blind box collection!</p>

            <div class = "hero-price">
                <strong>Rp 25.000</strong>
                <span>•</span>
                <span>Get Your ceBol Now!</span>
            </div>

            <div class = "hero-button">
                <button class = "button-kuning">
                    VIEW COLLECTION
                    ⭣
                </button>
                <button class = "button-putih">
                    ORDER NOW
                    ↗
                </button>
            </div>
        </div> 

        <div class = "hero-visual">
            <div class = "lingkaran">
                <img src="assets/logo-ceBol.svg" alt="Cebol gambar">

                <div class = "label">
                    5 Styles
                </div>
            </div>
        </div>

    </section>
</body>
</html>
